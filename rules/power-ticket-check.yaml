# 电力工作票核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ✅ 本次核查已取得 GB 26860—2011 第 5 章等条款的逐字原文（双源比对一致），可放心引用。
#    现行规程（均经标准平台核验元数据）：
#      GB 26860—2011 电力安全工作规程 发电厂和变电站电气部分（2012-06-01 实施）
#      GB 26859—2011 电力安全工作规程 电力线路部分
#      DL/T 408—2023（2024-06-28 实施，**代替 DL 408—1991**，与 GB 26860-2011 **并行，非替代关系**）
#      DL/T 409—2023、DL/T 560—2022
#
# ⚠️⚠️ 效力分层（决定每条规则的严重级，务必保留）：
#    GB 26860—2011 前言原文：「本标准的第5章和7.3.4为推荐性，其余为强制性。」
#    → **工作票制度所在的第5章是推荐性条款**，因此凡仅依据第5章的规则不应报 error；
#      第6章（安全技术措施）是强制性的，故引用 6.1.1 的 PT-006 才用 error。
#    本规则库据此分档：引用第5章者一律 warn 或 info，引用第6章者方可 error。
#
# ⚠️ 三处不得写入本规则库的常见说法（核查已确认查无依据）：
#    1. **「第一种工作票应在工作前一日送达」**：GB 26860-2011 / GB 26859-2011 完整文本中
#       **无任何此类时限**。不得作为检查项。
#    2. **「延期不超过 N 小时 / N 次」**：5.3.12 与 5.4.10 只写「延期应办理手续」，
#       **未规定任何时长或次数上限**。本规则库只做顺序判断，不带任何量化上限。
#    3. **「事故应急抢修单」是错误名称**：法定名称为**紧急抢修单**（GB 26860-2011 5.2.4 及附录D）
#       / **故障紧急抢修单**（DL/T 408—2023 附录E）。本规则库按法定名称给出默认票种清单。
#    另：**「两票三制」未在任何规范性文件中被定义内涵**——国能综通安全〔2024〕23号只要求
#    「严格落实两票三制」，故本规则库不为其附任何定义性条款。
#
# ⚠️ 票面栏目齐备性只能降级：GB 26860-2011 5.1.2 用词是「**可**包含」，附录 A~D 在标准目次中
#    均标注为「**资料性附录**」，国家层面**不存在强制性栏目枚举清单**。
#    因此 PT-001 出厂为空配置、由使用方填入本机构必填栏目，命中只作提示。
#
# ⚠️ 本插件**不判断安全措施是否充分**、**不判断该用哪一种票**、**不判断人员资格是否真实有效**。
#    标准只规定各角色的**职责**（5.4.1~5.4.5），**未规定资格条件**。
#    → requiredFields、ticketKinds、exclusiveRolePairs 三个清单**出厂为空**，未配置即进 skipped。

plugin: dsh-power-ticket-check
version: "2026.1"

rules:
  - id: PT-001
    title: 工作票应填写本机构要求的栏目
    severity: info
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 5.1.2
      excerpt: 工作票是准许在电气设备上工作的书面安全要求之一，可包含编号、工作地点、工作内容、计划工作时间、工作许可时间、工作终结时间、停电范围和安全措施，以及工作票签发人、工作许可人、工作负责人和工作班成员等内容。
      kind: institutional-configuration
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params:
      requiredFields: []
    note: >-
      requiredFields 出厂为空，表示**未配置**，本条进 skipped。
      **降级理由必须写清**：5.1.2 的用词是「**可**包含」，不是「应包含」；
      票面栏目见附录 A~D，而该四个附录在标准目次中均标注为「**资料性附录**」。
      因此国家层面**不存在强制性栏目枚举清单**，本条只按本机构配置核对，命中为提示而非违规认定。
      5.1.2 列举的栏目可作为配置参考：编号、工作地点、工作内容、计划工作时间、工作许可时间、
      工作终结时间、停电范围和安全措施，以及工作票签发人、工作许可人、工作负责人和工作班成员。

  - id: PT-002
    title: 工作票种类应与工作性质相符
    severity: warn
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 5.2.1~5.2.4
      excerpt: 需要高压设备全部停电、部分停电或做安全措施的工作，填用电气第一种工作票。
      kind: direct
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params:
      ticketKinds: []
      kindRules:
        - kind: 电气第一种工作票
          keywords: [全部停电, 部分停电, 做安全措施, 高压设备]
        - kind: 电气第二种工作票
          keywords: [带电设备外壳, 安全距离, 不可能触及]
        - kind: 电气带电作业工作票
          keywords: [带电作业, 不停电]
        - kind: 紧急抢修单
          keywords: [事故紧急抢修, 抢修]
    note: >-
      票种与工作性质的对应关系有明文（5.2.1 第一种、5.2.2 第二种、5.2.3 带电作业、
      5.2.4 紧急抢修单），故 kind 为 direct。
      **但严重级封顶 warn**：GB 26860—2011 前言明确「本标准的第5章……为推荐性」，
      工作票制度正落在第 5 章。
      **票种名称**：5.2.4 的法定名称为「**紧急抢修单**」，不是「事故应急抢修单」；
      DL/T 408—2023 改称「故障紧急抢修单」并新增「带电作业票」——两标准并行，故本清单同时接受两种写法。
      ticketKinds 出厂为空表示未配置票种清单，本条进 skipped；
      kindRules 为「工作性质关键词 → 票种」的建议映射，出厂已按 5.2.x 填好，可由使用方按本机构规程调整。
      **本插件不判断该作业应当使用哪一种票**，只在票种不在清单内或与关键词明显不符时提示复核。

  - id: PT-003
    title: 签发、许可与终结的时间先后应成立
    severity: warn
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 5.7.5
      excerpt: 全部工作完毕后，工作负责人应向运行人员交待所修项目状况、试验结果、发现的问题和未处理的问题等，并与运行人员共同检查设备状况、状态，在工作票上填明工作结束时间，经双方签名后表示工作票终结。
      kind: derived-from-principle
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    alsoBasis:
      - document: 《电力安全工作规程 发电厂和变电站电气部分》
        number: GB 26860—2011
        clause: 5.3.12
        excerpt: 电气第一种工作票、电气第二种工作票和电气带电作业工作票的有效时间，以批准的检修计划工作时间为限，延期应办理手续。
        kind: direct
        source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params:
      minMinutesBeforeWork: 0
      maxDurationHours: 0
    note: >-
      「先签发、后许可、再终结」由 5.3.5（签发主体）、5.5.1（许可手续）、5.7.5（终结）共同支撑，
      但**没有一条逐字写「时间必须递增」**，故 kind 为 derived-from-principle、封顶 warn；
      且第 5 章本身是推荐性。
      minMinutesBeforeWork 与 maxDurationHours 出厂为 0，表示**不做间隔与时长判断**：
      5.3.12 只写「以批准的检修计划工作时间为限，延期应办理手续」，
      **未规定任何间隔或时长上限**，所以这两个阈值纯属本机构管理要求，由使用方配置。
      本条把两端都换算为绝对分钟数比较，因此跨天也算得准。
      **不判断实际作业是否按票执行**，只核对票面时间的可能性。

  - id: PT-004
    title: 延期时间应把工作结束时间向后推
    severity: warn
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 5.3.12
      excerpt: 电气第一种工作票、电气第二种工作票和电气带电作业工作票的有效时间，以批准的检修计划工作时间为限，延期应办理手续。
      kind: direct
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params: {}
    note: >-
      5.3.12 规定「延期应办理手续」，配套票面栏目为「工作票延期：有效期延长到：…」。
      **严重级封顶 warn**：第 5 章为推荐性。
      **标准未规定延期的时长或次数上限**，故本条只核对延期时间是否落在计划结束时间之后、
      许可时间之后，**不带任何量化上限**，也**不判断延期手续是否齐备**。

  - id: PT-005
    title: 一个工作负责人不应同时执行两张及以上工作票
    severity: warn
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 5.3.7
      excerpt: 一个工作负责人不应同时执行两张及以上工作票。
      kind: direct
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params:
      exclusiveRolePairs: []
    note: >-
      5.3.7 是**逐字明文**，故 kind 为 direct；**但严重级仍封顶 warn**（第 5 章为推荐性）。
      单张工作票的材料无法看出"同时执行两张"，因此本条在单票模式下只核对配置的角色分设：
      exclusiveRolePairs 出厂为空表示**未配置**，本条进 skipped；
      要核对 5.3.7 本身，应由使用方把同一时间窗内的多张票合并核对（本参数即为此预留）。
      **不判断人员资格、不判断兼职是否经批准**：标准只规定职责（5.4.1~5.4.5），未规定资格条件。

  - id: PT-006
    title: 安全技术措施应包含停电、验电、装设接地线、悬挂标示牌、装设遮栏五项
    severity: error
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 6.1.1
      excerpt: 在电气设备上工作，应有停电、验电、装设接地线、悬挂标示牌和装设遮栏（围栏）等保证安全的技术措施。
      kind: direct
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params:
      measureTerms: [停电, 验电, 装设接地线, 悬挂标示牌, 装设遮栏]
      measureColumns: [安全措施, 应装设接地线, 应设遮栏, 应挂标示牌, 停电范围, 安全注意事项]
    note: >-
      本条是**唯一使用 error 级的规则**，理由是可查证的效力分层：
      GB 26860—2011 前言原文「本标准的第5章和7.3.4为推荐性，**其余为强制性**」，
      6.1.1 落在**强制性**的第 6 章，且五项技术措施为逐字枚举。
      本条核对**材料的安全措施文本中是否出现这五项**；measureColumns 为读取范围
      （按这些列名收集文本），measureTerms 为五项措施的关键词。
      请注意本条的边界：它只核对**票面是否写到了这五项**，
      **不判断措施内容是否与现场实际相符、是否执行到位**——那需要现场核查。

  - id: PT-007
    title: 工作许可手续应包含现场复查、指明带电部位与双方确认签名
    severity: warn
    basis:
      document: 《电力安全工作规程 发电厂和变电站电气部分》
      number: GB 26860—2011
      clause: 5.5.1
      excerpt: 工作许可人在完成施工作业现场的安全措施后，还应完成以下手续：a）会同工作负责人到现场再次检查所做的安全措施；b）对工作负责人指明带电设备的位置和注意事项；c）会同工作负责人在工作票上分别确认、签名。
      kind: direct
      source: http://www.gzhxaq.com/mydata/law/202008/21/15979710900961.htm
    params:
      permitTerms: [再次检查, 带电设备的位置, 确认, 签名]
      permitColumns: [安全措施, 补充安全措施, 许可开始工作时间, 工作许可人, 工作负责人]
    note: >-
      本条依据 5.5.1 的三项手续，属**逐字明文**，但 5.5.1 落在**推荐性**的第 5 章 ——
      因此本规则库把它定为 **warn**，与本库"推荐性条款不阻断流程"的口径一致
      （GB 26860—2011 前言原文：「本标准的第5章和7.3.4为推荐性，其余为强制性」）。
      ⚠️ 本库**唯一使用 error 级的是 PT-006**，其依据 6.1.1 落在强制性的第 6 章。
      若你的机构要求 5.5.1 类问题必须阻断流程，把本条 severity 改为 error 即可——
      **改严重级不需要改代码**，这正是"规则数据与代码分离"的用途。
      按默认配置，本条核对票面是否体现三项手续的关键词；
      **不判断现场是否真的复查了**，那需要现场核查与见证记录。

disabled: []
